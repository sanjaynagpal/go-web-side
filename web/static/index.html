<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S-Lab Setup</title>
  <script>
    // Apply a saved theme choice before first paint to avoid a flash.
    try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
  </script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #667085; --line: #e3e6ea;
      --accent: #2557d6; --accent-text: #fff;
      --ok: #1a7f37; --warn: #9a6700; --fail: #cf222e; --info: #667085;
    }
    :root[data-theme="light"] { color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #14171b; --card: #1d2127; --text: #e8eaed; --muted: #9aa3ad; --line: #2c323a;
        --accent: #6c93f5; --accent-text: #0c1220;
        --ok: #3fb950; --warn: #d29922; --fail: #f85149; --info: #9aa3ad;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #14171b; --card: #1d2127; --text: #e8eaed; --muted: #9aa3ad; --line: #2c323a;
      --accent: #6c93f5; --accent-text: #0c1220;
      --ok: #3fb950; --warn: #d29922; --fail: #f85149; --info: #9aa3ad;
    }
    /* Cross-fade colours while the theme is being switched. */
    :root.theming *, :root.theming *::before, :root.theming *::after {
      transition: background-color .35s, color .35s, border-color .35s, box-shadow .35s !important;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 24px 16px 40px; }
    h1 { margin: 0 0 2px; font-size: 22px; }
    .sub { margin: 0 0 20px; color: var(--muted); }
    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .conn { display: inline-flex; align-items: center; gap: 7px; margin-top: 4px; padding: 3px 11px 3px 9px;
      border: 1px solid var(--line); border-radius: 999px; background: var(--card); font-size: 13px; white-space: nowrap; }
    .conn .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--info); }
    .conn.connected .dot { background: var(--ok); animation: pulse 2.4s ease-out infinite; }
    .conn.connecting .dot { background: var(--warn); animation: blink 1s steps(2, start) infinite; }
    .conn.disconnected { color: var(--fail); border-color: var(--fail); }
    .conn.disconnected .dot { background: var(--fail); }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 55%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }
    @keyframes blink { to { opacity: .25; } }
    .head-right { display: flex; align-items: center; gap: 8px; }
    .icon { position: relative; width: 32px; height: 32px; margin-top: 4px; padding: 0; border: 1px solid var(--line);
      border-radius: 50%; background: var(--card); color: var(--text); cursor: pointer; transition: border-color .2s; }
    .icon:hover { border-color: var(--accent); }
    .icon svg { position: absolute; inset: 7px; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round; transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .3s; }
    /* Show the icon for the theme a click switches to: sun in dark mode, moon in light. */
    .icon .sun  { opacity: 0; transform: rotate(-90deg) scale(.4); }
    .icon .moon { opacity: 1; transform: none; }
    .icon[data-mode="dark"] .sun  { opacity: 1; transform: none; }
    .icon[data-mode="dark"] .moon { opacity: 0; transform: rotate(90deg) scale(.4); }

    @keyframes rise { from { opacity: 0; } }
    @keyframes pop  { from { opacity: 0; } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(350%); } }
    .working .track { height: 6px; border-radius: 3px; overflow: hidden; background: color-mix(in srgb, var(--accent) 18%, transparent); }
    .working .bar { width: 30%; height: 100%; border-radius: 3px; background: var(--accent); animation: slide 1.3s ease-in-out infinite; }
    .working p { margin: 10px 0 0; color: var(--muted); }
    .working .elapsed { font-variant-numeric: tabular-nums; }
    section.card { animation: rise .28s ease-out; }
    .banner { animation: pop .3s ease-out; }
    ul.steps li { animation: fade .3s ease-out both; animation-delay: min(calc(var(--i, 0) * 45ms), 700ms); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
    .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; color: var(--muted); font: inherit; cursor: pointer; transition: color .2s, border-color .2s; }
    .tabs button:hover { color: var(--text); }
    .tabs button[aria-selected="true"] { color: var(--text); border-color: var(--accent); font-weight: 600; }
    label.opt { display: block; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; transition: border-color .2s, background-color .2s; }
    label.opt:hover { border-color: var(--muted); }
    label.opt:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
    label.opt small { display: block; color: var(--muted); margin-left: 24px; }
    .shield { color: var(--warn); }
    button.primary { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px; padding: 9px 18px; font: inherit; font-weight: 600; cursor: pointer; transition: filter .2s, opacity .2s; }
    button.primary:hover:not(:disabled) { filter: brightness(1.1); }
    button.primary:active:not(:disabled) { filter: brightness(.92); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.primary.busy:disabled { opacity: .85; cursor: progress; }
    button.primary.busy::before { content: ""; display: inline-block; width: 1em; height: 1em; margin-right: 8px; vertical-align: -2px;
      border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
    .status { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; }
    .status dt { color: var(--muted); }
    .status dd { margin: 0; overflow-wrap: anywhere; }
    .banner { border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; border: 1px solid var(--line); font-weight: 600; }
    .banner.ok { color: var(--ok); } .banner.bad { color: var(--fail); }
    ul.steps { list-style: none; margin: 0; padding: 0; }
    ul.steps li { display: grid; grid-template-columns: 52px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
    ul.steps li:last-child { border: 0; }
    .tag { font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .tag.ok { color: var(--ok); } .tag.warn { color: var(--warn); } .tag.fail { color: var(--fail); } .tag.info { color: var(--info); }
    .detail { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .hidden { display: none; }
    p.note { color: var(--muted); margin: 0 0 12px; }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>S-Lab Setup</h1>
      <p class="sub">Version <span id="version">…</span></p>
    </div>
    <div class="head-right">
      <div id="conn" class="conn connecting" role="status" aria-live="polite" title="Connection to the installer">
        <span class="dot"></span><span id="conn-text">Connecting…</span>
      </div>
      <button id="theme" class="icon" type="button" title="Switch theme" aria-label="Switch theme">
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <div class="card"><dl class="status" id="status"></dl></div>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="install" aria-selected="true">Install</button>
    <button role="tab" data-tab="uninstall" aria-selected="false">Uninstall</button>
    <button role="tab" data-tab="doctor" aria-selected="false">Doctor</button>
  </div>

  <section id="install" class="card">
    <label class="opt"><input type="radio" name="iscope" value="user" checked> Just for me
      <small>Installs to your profile. No administrator permission needed.</small></label>
    <label class="opt"><input type="radio" name="iscope" value="machine"> For all users on this computer <span class="shield">&#9211; administrator</span>
      <small>Installs to Program Files. Windows will ask for permission.</small></label>
    <button class="primary" id="do-install">Install</button>
  </section>

  <section id="uninstall" class="card hidden">
    <div id="uninstall-options"></div>
    <button class="primary" id="do-uninstall">Uninstall</button>
  </section>

  <section id="doctor" class="card hidden">
    <p class="note">Checks the registry record, files and version of every S-Lab installation. Nothing is changed.</p>
    <button class="primary" id="do-doctor">Run diagnostics</button>
  </section>

  <section id="result" class="card hidden" aria-live="polite"></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const label = { user: "Current user", machine: "All users" };
let busy = false;
let online = false, canInstall = false, canUninstall = false;

// Actions need a live server and no other action in flight.
function applyEnabled() {
  const ok = online && !busy;
  const why = online ? "" : "Not connected to the installer";
  [["do-install", canInstall], ["do-uninstall", canUninstall], ["do-doctor", true]].forEach(([id, allowed]) => {
    $(id).disabled = !(ok && allowed);
    $(id).title = why;
  });
}

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  return res.json();
}

function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

async function refresh() {
  const st = await api("/api/status");
  $("version").textContent = st.version;
  const row = (k, i) => `<dt>${k}</dt><dd>${i ? `Installed (v${esc(i.version)}) at ${esc(i.installPath)}` : "Not installed"}</dd>`;
  $("status").innerHTML = row("Current user", st.user) + row("All users", st.machine) +
    `<dt>Privileges</dt><dd>${st.elevated ? "Administrator" : "Standard user"}</dd>`;
  if (!st.supported) $("status").innerHTML += "<dt>Note</dt><dd>This installer only supports Windows.</dd>";

  const found = ["user", "machine"].filter((s) => st[s]);
  $("uninstall-options").innerHTML = found.length
    ? found.map((s, i) => `<label class="opt"><input type="radio" name="uscope" value="${s}" ${i ? "" : "checked"}> ${label[s]}
        ${s === "machine" ? '<span class="shield">&#9211; administrator</span>' : ""}<small>${esc(st[s].installPath)}</small></label>`).join("")
    : '<p class="note">S-Lab is not installed.</p>';
  canUninstall = found.length > 0;
  canInstall = st.supported;
  applyEnabled();
}

function show(r) {
  const el = $("result");
  el.classList.remove("hidden");
  el.innerHTML = `<div class="banner ${r.ok ? "ok" : "bad"}">${esc(r.message)}</div>` +
    (r.steps?.length ? `<ul class="steps">${r.steps.map((s, i) =>
      `<li style="--i:${i}"><span class="tag ${esc(s.status)}">${esc(s.status)}</span><span>${esc(s.name)}<div class="detail">${esc(s.detail)}</div></span></li>`).join("")}</ul>` : "");
}

function showWorking(hint) {
  const el = $("result");
  el.classList.remove("hidden");
  el.setAttribute("aria-busy", "true");
  el.innerHTML = `<div class="working"><div class="track"><div class="bar"></div></div>
    <p>${esc(hint)} <span class="elapsed" id="elapsed">0s</span></p></div>`;
}

async function run(button, text, fn, hint = "Working, please wait…") {
  if (busy) return;
  busy = true;
  const started = Date.now();
  const showTimer = setTimeout(() => {
    showWorking(hint);
    tick = setInterval(() => {
      const e = $("elapsed");
      if (e) e.textContent = Math.floor((Date.now() - started) / 1000) + "s";
    }, 500);
  }, 400);
  let tick;
  const orig = button.textContent;
  button.textContent = text;
  button.classList.add("busy");
  applyEnabled();
  try { show(await fn()); }
  catch (e) { show({ ok: false, message: "Request failed: " + e.message }); }
  clearTimeout(showTimer);
  clearInterval(tick);
  $("result").removeAttribute("aria-busy");
  busy = false;
  button.textContent = orig;
  button.classList.remove("busy");
  applyEnabled();
  await refresh().catch(() => {});
}

const chosen = (name) => document.querySelector(`input[name=${name}]:checked`)?.value;

$("do-install").onclick = (e) => {
  const scope = chosen("iscope");
  run(e.target, scope === "machine" ? "Waiting for permission…" : "Installing…", () => api("/api/install", { scope }),
    scope === "machine" ? "Approve the Windows permission prompt, then the install continues." : "Installing S-Lab…");
};
$("do-uninstall").onclick = (e) => {
  const scope = chosen("uscope");
  if (scope && confirm(`Uninstall S-Lab for ${label[scope].toLowerCase()}?`))
    run(e.target, "Uninstalling…", () => api("/api/uninstall", { scope }),
      scope === "machine" ? "Approve the Windows permission prompt, then the uninstall continues." : "Removing S-Lab…");
};
$("do-doctor").onclick = (e) => run(e.target, "Checking…", () => api("/api/doctor"), "Running diagnostics…");

document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", x === b));
  ["install", "uninstall", "doctor"].forEach((id) => $(id).classList.toggle("hidden", id !== b.dataset.tab));
  $("result").classList.add("hidden");
});

// Theme: follows the system until the user picks one, then remembers it.
const root = document.documentElement;
const systemDark = matchMedia("(prefers-color-scheme: dark)");
const theme = () => root.dataset.theme || (systemDark.matches ? "dark" : "light");
function paintTheme() {
  $("theme").dataset.mode = theme();
  $("theme").setAttribute("aria-label", `Switch to ${theme() === "dark" ? "light" : "dark"} theme`);
}
$("theme").onclick = () => {
  const next = theme() === "dark" ? "light" : "dark";
  root.classList.add("theming");
  root.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch {}
  paintTheme();
  setTimeout(() => root.classList.remove("theming"), 400);
};
systemDark.addEventListener("change", paintTheme);
paintTheme();

// Fit the app window to the content so it neither wastes space nor scrolls.
// Best effort: browsers that refuse window.resizeTo keep the launch size.
function fitWindow() {
  const frameW = window.outerWidth - window.innerWidth;
  const frameH = window.outerHeight - window.innerHeight;
  const h = Math.ceil(document.querySelector("main").getBoundingClientRect().height);
  const w = 700 - frameW;
  const maxH = screen.availHeight;
  try { window.resizeTo(w + frameW, Math.min(h + frameH, maxH)); } catch {}
}
let fitTimer;
new ResizeObserver(() => { clearTimeout(fitTimer); fitTimer = setTimeout(fitWindow, 50); })
  .observe(document.querySelector("main"));

// An open connection tells the server this window is alive; when the window
// closes the connection drops and the CLI shuts down. (Reconnects are automatic.)
const session = new EventSource("/api/session");
let downTimer;
function setConn(state, text) {
  $("conn").className = "conn " + state;
  $("conn-text").textContent = text;
  online = state === "connected";
  applyEnabled();
}
session.onopen = () => {
  clearTimeout(downTimer);
  setConn("connected", "Connected");
  refresh();
};
session.onerror = () => {
  // The browser retries on its own; call it stopped if that keeps failing.
  setConn("connecting", "Reconnecting…");
  clearTimeout(downTimer);
  downTimer = setTimeout(() => setConn("disconnected", "Server stopped"), 8000);
};

applyEnabled(); // disabled until the session connects
refresh().catch(() => {});
</script>
</body>
</html>
